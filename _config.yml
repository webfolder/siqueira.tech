title: Siqueira
email: siqueirajordao@riseup.net
url: https://siqueira.tech
logo: logo.png
locale: en_US
permalink: pretty
description: "Logbooks are an unstructured text which we explain operations, and approaches taken by us to finish the work; in a nutshell, it is an analogy with navigation of a ship. I like this idea and continuously use it in my life, and this site represents a materialization of this concept."
keywords: "kernel, development, bash, c, tutorial, documentation, report, siqueira"

# Jekyll
permalink:          /:categories/:title/
markdown:           kramdown
highlighter:        rouge
kramdown:
  auto_ids:         true
  footnote_nr:      1
  entity_output:    as_char
  toc_levels:       1..6
  enable_coderay:   false

language_default: en

collections:
  en:
    output: true
    permalink: /:collection/:slug
  pt:
    output: true
    permalink: /:collection/:slug

defaults:
- scope:
    path: "_pages/en"
    type: "pages"
  values:
    permalink: /:slug
- scope:
    path: "_posts/en"
    type: "posts"
  values:
    permalink: /:slug
- scope:
    path: "_pages/pt"
    type: "pages"
  values:
    permalink: /pt/:slug
- scope:
    path: "_posts/pt"
    type: "posts"
  values:
    permalink: /pt/:slug

# Gems
plugins:
  - jekyll-feed

# Exclude list
include: [_pages]
exclude: [README.md, Gemfile, Gemfile.lock, _site, src, vendor, CNAME, LICENSE, Rakefile, .sass-cache, .DS_Store]
