---
layout: default
permalink: /categories/
---

{% include get_filtered_posts_and_pages.html %}

<div>
  {% if page.title %}
    <h1> {{ page.title }} </h1>
  {% endif %}

  <ul class="posts-list">
    {% for post in posts %}
      {% if post.categories contains 'status_update' %}
        {% include post_list.html %}
      {% endif %}
    {% endfor %}
  </ul>
</div>
