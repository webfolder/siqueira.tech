<!DOCTYPE html>
<html>

  <head>
    <!-- Original
      <meta name="viewport" content="width=device-width, initial-scale=1">
    -->

    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">

    <!-- CSS -->
    <link href="/assets/css/site.css" rel="stylesheet">
    <link href="/assets/css/menu.css" rel="stylesheet">
    <link href="/assets/css/list_block.css" rel="stylesheet">
    <link href="/assets/css/utils.css" rel="stylesheet">
    <link href="/assets/css/syntax.css" rel="stylesheet">
    <link href="/assets/css/image-popup.css" rel="stylesheet">

    <!-- Favicons -->
    <link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/favicon.png" />
    <link rel="shortcut icon" href="{{ site.baseurl }}/favicon.ico" />

    <!-- Handheld -->
    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Special characters -->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" >

    <!-- Feed -->
    {% feed_meta %}

  <body>

  {% include navbar.html %}

  <div class="container">
    {{ content }}

    {% include sidebar.html %}

  </body>
</html>
