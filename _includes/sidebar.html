{% assign page_url = page.url %}

{% include check_lang.html url=page_url %}

{% for page in pages %}
  {% if page.categories contains 'sidebar' %}
    <div class="sidebar">
      {{ page.content | markdownify }}

      <!-- Control lang option -->
      <ul class="lang">
        <li>
          <a href="{{ lang_url }}" class="{{ p.lang }}" >
            {{site.data.languages[p.lang].label}}
          </a>
        </li>
      </ul>

    </div>
  {% endif %}
{% endfor %}
