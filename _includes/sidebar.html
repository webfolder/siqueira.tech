{% include check_lang.html url = page.url %}

{% for page in pages %}
  {% if page.categories contains 'sidebar' %}
    <div class="sidebar">
      {{ page.content | markdownify }}

      <!-- Control lang option -->
      <ul class="lang">
        <li>
          <a href="{{ lang_url }}" class="{{ change_lang_to }}" >
            {{site.data.languages[change_lang_to].label}}
          </a>
        </li>
      </ul>

    </div>
  {% endif %}
{% endfor %}
